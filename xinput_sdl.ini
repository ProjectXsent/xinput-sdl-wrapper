; xinput_sdl.ini - place next to the wrapper DLL (optional)

[General]
; 1 = swap A<->B and X<->Y (Nintendo-style physical layout)
SwapAB=0
; 0 = ignore rumble requests from the game
Rumble=1
; 1 = hide DirectInput8 game controllers from the game (MinHook), so the pad is
;     only seen through XInput. Set 0 if a game loses input with it enabled.
HideDInput=1

[Logging]
; Writes input_sdl.log next to the DLL (overwritten on every start; falls back
; to %TEMP% if the folder is not writable)
Enabled=0
; 1 = also log debug detail: SDL's own log, gamepad mappings, rumble commands
Verbose=0
; 1 = mirror log lines to OutputDebugString (view with DebugView)
DebugOutput=0

[SDL]
; Advanced. Leave a key empty to keep SDL's default; 0/1 forces it.
;
; 0 = SDL must not load an XInput DLL (it would find this wrapper and recurse).
;     Only set 1 if the wrapper is NOT named like the DLL SDL loads (xinput1_4).
XInput=1
; Windows backends used to find pads. Try disabling these if the game loses
; focus or shows a busy cursor, or if a pad does not show up.
;RawInput=
;WGI=
;HIDAPI=
;DirectInput=
; 1 = poll joysticks on a separate SDL thread
;JoystickThread=
